<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather — About Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./weather.css">
</head>
<body>
  <div class="app-layout">
    <div class="background-glow bg-glow-1"></div>
    <div class="background-glow bg-glow-2"></div>

    <!-- Header Navigation Bar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19.5A4.5 4.5 0 0 0 21 15c0-2.3-1.7-4.2-3.9-4.5A7 7 0 0 0 4 10.5a4.5 4.5 0 0 0 .5 8.9h13z"/>
          </svg>
        </div>
        <h1 class="brand-title">SkyPulse</h1>
      </div>

      <!-- Search bar -->
      <form class="search-bar" role="search" aria-label="Search for a city" id="search-form">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="city-search" type="text" placeholder="Search city (e.g., Tokyo, London, Lagos)..." autocomplete="off" />
        <button type="submit" class="search-btn" aria-label="Search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <!-- Location pill -->
      <button class="location-chip" type="button" id="location-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="location-label">Florida, USA</span>
      </button>
    </header>

    <!-- Main Dashboard Grid -->
    <main class="dashboard">
      <!-- Left / Top: Weather Hero Section -->
      <section class="hero-card" aria-label="Current Weather Overview">
        <div class="hero-header">
          <span class="badge">Today's Forecast</span>
          <h2 class="heading">About Today</h2>
        </div>

        <!-- Dynamic Illustration Wrap -->
        <div class="illustration-wrap">
          <div class="illustration-glow" aria-hidden="true"></div>
          <svg id="weather-illustration" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weather condition illustration">
            <defs>
              <linearGradient id="cloudBody" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#eaf6ff"/>
                <stop offset="55%" stop-color="#9cd2ff"/>
                <stop offset="100%" stop-color="#4f9dee"/>
              </linearGradient>
              <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#bfe3ff"/>
                <stop offset="100%" stop-color="#4f9dee"/>
              </linearGradient>
              <radialGradient id="shine" cx="35%" cy="25%" r="60%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <ellipse cx="100" cy="122" rx="55" ry="10" fill="#000000" opacity="0.12"/>
            <g>
              <path d="M55 92c-14 0-24-10.5-24-23.5S41 45 55 45c2 0 4 .2 6 .6C65 33 78 24 93 24c17 0 31.5 12 34.8 28 12.7 1 22.2 11.4 22.2 24 0 13.3-11 24-24.7 24H55z" fill="url(#cloudBody)"/>
              <path d="M55 92c-14 0-24-10.5-24-23.5S41 45 55 45c2 0 4 .2 6 .6C65 33 78 24 93 24c17 0 31.5 12 34.8 28 12.7 1 22.2 11.4 22.2 24 0 13.3-11 24-24.7 24H55z" fill="url(#shine)"/>
            </g>
            <g>
              <path class="drop" d="M78 104c0 4.4-3.6 7.5-7.5 7.5S63 108.4 63 104c0-4.4 7.5-13 7.5-13s7.5 8.6 7.5 13z" fill="url(#dropGrad)"/>
              <path class="drop" d="M108 108c0 4.4-3.6 7.5-7.5 7.5S93 112.4 93 108c0-4.4 7.5-13 7.5-13s7.5 8.6 7.5 13z" fill="url(#dropGrad)"/>
              <path class="drop" d="M138 104c0 4.4-3.6 7.5-7.5 7.5S123 108.4 123 104c0-4.4 7.5-13 7.5-13s7.5 8.6 7.5 13z" fill="url(#dropGrad)"/>
            </g>
          </svg>
        </div>

        <div class="temperature-display">
          <p class="temp" id="temperature">19<sup>°</sup></p>
          <p class="desc" id="desc">Overcast clouds</p>
        </div>
      </section>

      <!-- Right / Bottom: Detailed Atmospheric Metrics Grid -->
      <section class="metrics-section" aria-label="Weather Statistics">
        <h3 class="section-title">Highlights</h3>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-header">
              <span class="stat-icon pressure-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"/>
                  <path d="M12 7v5l3 3"/>
                </svg>
              </span>
              <span class="stat-label">Atmospheric Pressure</span>
            </div>
            <div class="stat-body">
              <span class="stat-value" id="pressure-value">1013 hPa</span>
              <span class="stat-subtext">Normal Range</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-header">
              <span class="stat-icon wind-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
                  <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
                  <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
                </svg>
              </span>
              <span class="stat-label">Wind Speed</span>
            </div>
            <div class="stat-body">
              <span class="stat-value" id="wind-value">7 km/h</span>
              <span class="stat-subtext">Gentle breeze</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-header">
              <span class="stat-icon humidity-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
              </span>
              <span class="stat-label">Humidity</span>
            </div>
            <div class="stat-body">
              <span class="stat-value" id="humidity-value">21%</span>
              <span class="stat-subtext">Relative moisture</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="./weather.js"></script>
</body>
</html>
