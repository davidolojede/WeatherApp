<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather — About Today</title>
  <link rel="shortcut icon" href="/temp/comfortable.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/weather.css">
</head>

<body>
  <main class="app-card" aria-label="Weather app">

    <!-- Top bar-->
    <div class="topbar">
      <button class="icon-btn" type="button" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <button class="location" type="button" id="location-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
        <span id="location-label">Florida, USA</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
    </div>

    <!-- Search -->
    <form class="search-bar" role="search" aria-label="Search for a city" onsubmit="return false;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input onchange="fetchInfo()" class="search-input" id="city-search" type="text"
        placeholder="Search for a city or airport" autocomplete="off" />
    </form>
    <p id="error-message"></p>

    <h1 class="heading">About Today</h1>

    <div id="img-container">
      <img id="weather-img" src="./temp/cool.png" alt=""> 
    </div>

    <p class="desc" id="desc">Overcast clouds</p>
    <p class="temp" id="temperature">19<sup>°</sup></p>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M8 16.5c0 1.9-1.6 3.5-3.5 3.5S1 18.4 1 16.5 4.5 11 4.5 11 8 14.6 8 16.5z" />
            <path d="M17.5 3.5c3 0 5.5 2.5 5.5 5.5s-2.5 5.5-5.5 5.5H7" />
          </svg>
        </span>
        <span class="stat-value" id="pressure-value">90%</span>
        <span class="stat-label">Pressure</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M2 12h13a3 3 0 1 0-3-3" />
            <path d="M2 17h9a3 3 0 1 1-3 3" />
          </svg>
        </span>
        <span class="stat-value" id="wind-value">7 km/h</span>
        <span class="stat-label">Wind</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M12 3s7 7.4 7 12a7 7 0 0 1-14 0c0-4.6 7-12 7-12z" />
          </svg>
        </span>
        <span class="stat-value" id="humidity-value">21%</span>
        <span class="stat-label">Humidity</span>
      </div>
    </div>
  </main>
</body>
<script src="/weather.js"></script>

</html>
